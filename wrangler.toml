name = "mivida"
main = "src/index.ts"
compatibility_date = "2025-08-01"
account_id = "REPLACE_WITH_ACCOUNT_ID"

# D1 database binding (create with: wrangler d1 create mivida-db)
[[d1_databases]]
binding = "DB"
database_name = "mivida-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Secrets (set with: wrangler secret put MIVIDA_AUTH_TOKEN)
[vars]
ENVIRONMENT = "dev"

# Daily exception monitor: 06:30 UTC
[triggers]
crons = ["30 6 * * *"]
